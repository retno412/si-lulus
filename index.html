<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Pengumuman Kelulusan</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background-color: #f4f7f6; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        .container { 
            background-color: white; 
            padding: 30px; 
            border-radius: 10px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
            text-align: center; 
            width: 90%; 
            max-width: 400px; 
        }
        h2 { color: #2c3e50; margin-bottom: 5px; }
        p { color: #7f8c8d; font-size: 14px; margin-bottom: 25px; }
        input { 
            width: 100%; 
            padding: 12px; 
            margin-bottom: 15px; 
            border: 1px solid #bdc3c7; 
            border-radius: 5px; 
            box-sizing: border-box; 
            font-size: 16px; 
            text-align: center;
        }
        button { 
            background-color: #3498db; 
            color: white; 
            padding: 14px; 
            border: none; 
            border-radius: 5px; 
            width: 100%; 
            font-size: 16px; 
            cursor: pointer; 
            font-weight: bold;
        }
        button:hover { background-color: #2980b9; }
        #hasil { 
            margin-top: 20px; 
            font-size: 16px; 
            padding: 15px; 
            border-radius: 5px; 
            display: none;
            line-height: 1.5;
        }
        .lulus { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .tidak-lulus { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .not-found { background-color: #fff3cd; color: #856404; border: 1px solid #ffeeba; }
        .nama-siswa { font-size: 20px; font-weight: bold; display: block; margin: 10px 0; }
    </style>
</head>
<body>
    <div class="container">
        <h2>PORTAL SI-LULUS</h2>
        <p>Silakan masukkan Nomor Induk Siswa Nasional (NISN) Anda untuk melihat status kelulusan.</p>
        
        <form id="formCek">
            <input type="text" id="nisn" placeholder="Contoh: 1001" required autocomplete="off">
            <button type="submit">Cari Data Kelulusan</button>
        </form>
        
        <div id="hasil"></div>
    </div>

    <script>
        document.getElementById('formCek').addEventListener('submit', async function(e) {
            e.preventDefault(); // Mencegah halaman refresh
            const inputNisn = document.getElementById('nisn').value;
            const kotakHasil = document.getElementById('hasil');
            
            // Menampilkan status loading
            kotakHasil.style.display = 'block';
            kotakHasil.className = '';
            kotakHasil.innerHTML = 'Sedang mencari data di server...';

            try {
                // Mengirim permintaan ke backend
                const response = await fetch('/cek-kelulusan', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nisn: inputNisn })
                });
                
                const responsServer = await response.json();

                // Mengolah jawaban dari backend
                if (responsServer.ditemukan) {
                    const data = responsServer.data;
                    if(data.status_lulus === 'LULUS') {
                        kotakHasil.className = 'lulus';
                        kotakHasil.innerHTML = `Selamat!<br><span class="nama-siswa">${data.nama}</span>Anda dinyatakan <strong>LULUS</strong>.`;
                    } else {
                        kotakHasil.className = 'tidak-lulus';
                        kotakHasil.innerHTML = `Mohon Maaf.<br><span class="nama-siswa">${data.nama}</span>Anda dinyatakan <strong>TIDAK LULUS</strong>.`;
                    }
                } else {
                    kotakHasil.className = 'not-found';
                    kotakHasil.innerHTML = 'Data tidak ditemukan. Silakan periksa kembali NISN Anda.';
                }
            } catch (error) {
                kotakHasil.className = 'not-found';
                kotakHasil.innerHTML = 'Terjadi kesalahan jaringan atau server sedang down.';
            }
        });
    </script>
</body>
</html>
